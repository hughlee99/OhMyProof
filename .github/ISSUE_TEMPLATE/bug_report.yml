name: Bug report
description: Report a reproducible problem in OhMyProof
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source code, or sensitive report artifacts.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest public reproduction or commands you can share safely.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OhMyProof version
      placeholder: 0.2.0
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 / Node 22 / Codex CLI
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Sanitized metrics, error messages, or report excerpts only.
