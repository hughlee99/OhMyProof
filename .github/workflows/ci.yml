name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: CLI smoke test
        run: npm run check

      - name: Public readiness
        run: npm run public:check

      - name: Package dry run
        run: npm pack --dry-run

      - name: Campaign smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run demo
